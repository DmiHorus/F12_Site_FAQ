<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Минвайл{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/site.css">
  <link rel="stylesheet" href="/static/css/chat.css">
</head>
<body>
  <a class="skip" href="#content">К содержанию</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">
        <img class="logo" src="/static/img/mnwhl-logo-white.png" alt="MNWHL">
      </a>
      <nav class="nav" aria-label="Разделы сайта">
        <a href="/" {% if page == "home" %}aria-current="page"{% endif %}>Главная</a>
        <a href="/cases" {% if page == "cases" %}aria-current="page"{% endif %}>Кейсы</a>
        <a href="/faq" {% if page == "faq" %}aria-current="page"{% endif %}>FAQ</a>
        <a href="/contacts" {% if page == "contacts" %}aria-current="page"{% endif %}>Контакты</a>
      </nav>
    </div>
  </header>
  <main id="content" class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>ООО «Минвайл» · <a href="mailto:hello@mnwhl.ru">hello@mnwhl.ru</a> · <a href="https://mnwhl.ru">mnwhl.ru</a></p>
    </div>
  </footer>

  <button type="button" id="chat-launcher" class="chat-launcher" aria-label="Открыть чат" aria-expanded="false" aria-controls="chat-widget">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H13l-3.2 2.8a.8.8 0 0 1-1.3-.6V16H6.5A2.5 2.5 0 0 1 4 13.5v-8z"/>
    </svg>
  </button>
  <section id="chat-widget" class="chat-widget" role="dialog" aria-label="FAQ-ассистент" aria-hidden="true">
    <header class="chat-header">
      <div>
        <p class="chat-title">FAQ-ассистент</p>
        <p class="chat-subtitle">Минвайл</p>
      </div>
      <button type="button" id="chat-close" class="chat-close" aria-label="Закрыть чат">×</button>
    </header>
    <div id="chat-messages" class="chat-messages"></div>
    <form id="chat-form" class="chat-form">
      <label class="visually-hidden" for="chat-input">Сообщение</label>
      <input id="chat-input" type="text" autocomplete="off" placeholder="Спросите о компании или продуктах">
      <button type="submit" id="chat-send">Отправить</button>
    </form>
  </section>
  <script src="/static/js/chat-widget.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
